name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  TRAKT_CLIENT_ID: ${{ vars.TRAKT_CLIENT_ID }}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Validate Trakt client ID
        run: |
          if [ -z "$TRAKT_CLIENT_ID" ]; then
            echo "TRAKT_CLIENT_ID repository variable is required"
            exit 1
          fi

      - name: Build
        run: |
          xcodebuild -project MyTV.xcodeproj \
            -scheme MyTV \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            TRAKT_CLIENT_ID="$TRAKT_CLIENT_ID" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Create DMG
        run: |
          cd build/Build/Products/Release
          mkdir dmg_staging
          cp -R MyTV.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "MyTV" -srcfolder dmg_staging -ov -format UDZO MyTV-macOS.dmg
          rm -rf dmg_staging

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTV-macOS
          path: build/Build/Products/Release/MyTV-macOS.dmg

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Validate Trakt client ID
        run: |
          if [ -z "$TRAKT_CLIENT_ID" ]; then
            echo "TRAKT_CLIENT_ID repository variable is required"
            exit 1
          fi

      - name: Build
        run: |
          xcodebuild -project MyTV.xcodeproj \
            -scheme MyTV \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            TRAKT_CLIENT_ID="$TRAKT_CLIENT_ID" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Create DMG
        run: |
          cd build/Build/Products/Release
          mkdir dmg_staging
          cp -R MyTV.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "MyTV" -srcfolder dmg_staging -ov -format UDZO MyTV-macOS.dmg
          rm -rf dmg_staging

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Build/Products/Release/MyTV-macOS.dmg
          generate_release_notes: true
