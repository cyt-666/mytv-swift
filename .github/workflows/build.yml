name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '.github/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/**'

env:
  TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_APP="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="/Applications/Xcode.app"
          fi

          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Validate Trakt client ID
        run: |
          if [ -z "$TRAKT_CLIENT_ID" ]; then
            echo "TRAKT_CLIENT_ID repository secret is required"
            exit 1
          fi
          echo "::add-mask::$TRAKT_CLIENT_ID"

      - name: Build
        run: |
          xcodebuild -project MyTV.xcodeproj \
            -scheme MyTV \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Create DMG
        run: |
          cd build/Build/Products/Release
          mkdir dmg_staging
          cp -R MyTV.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "MyTV" -srcfolder dmg_staging -ov -format UDZO MyTV-macOS.dmg
          rm -rf dmg_staging

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTV-macOS
          path: build/Build/Products/Release/MyTV-macOS.dmg

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: MyTV-macOS
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/MyTV-macOS.dmg
          generate_release_notes: true
