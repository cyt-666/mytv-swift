name: MyTV
options:
  bundleIdPrefix: com.mytv
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
attributes:
  LastUpgradeCheck: "2650"

targets:
  MyTV:
    type: application
    platform: macOS
    configFiles:
      Debug: MyTV/Config/MyTV.xcconfig
      Release: MyTV/Config/MyTV.xcconfig
    sources:
      - path: MyTV
        excludes:
          - iOS
          - Config/Local.xcconfig
    info:
      path: MyTV/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TraktClientID: $(TRAKT_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mytv.app
        MARKETING_VERSION: "1.0.8"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: MyTV/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: MyTV/MyTV.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

  MyTViOS:
    type: application
    platform: iOS
    productName: MyTV
    configFiles:
      Debug: MyTV/Config/MyTV.xcconfig
      Release: MyTV/Config/MyTV.xcconfig
    supportedDestinations:
      - iOS
      - iOS Simulator
    sources:
      - path: MyTV
        excludes:
          - Info.plist
          - MyTV.entitlements
          - Config/Local.xcconfig
    info:
      path: MyTV/iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TraktClientID: $(TRAKT_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: com.mytv.app.ios.oauth
            CFBundleURLSchemes:
              - mytv
        BGTaskSchedulerPermittedIdentifiers:
          - com.mytv.app.ios.moviepilot.refresh
        UIBackgroundModes:
          - fetch
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mytv.app.ios
        MARKETING_VERSION: "1.0.8"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: MyTV
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SUPPORTED_DESTINATIONS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: MyTV/iOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
